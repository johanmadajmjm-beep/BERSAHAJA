<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Monitoring Nakes</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
.chart-box{position:relative;height:260px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px}
.kpi-card .kv{font-size:24px;font-weight:800;line-height:1}
.kpi-card .kl{font-size:10px;color:var(--text2);margin-top:4px}
.kpi-card .ki{font-size:16px;margin-bottom:6px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.dtbl{width:100%;border-collapse:collapse;font-size:11.5px}
.dtbl th{background:var(--surface2);color:var(--text2);font-weight:600;padding:9px 11px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.dtbl td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:top}
.dtbl tr:hover td{background:rgba(255,255,255,.02)}
.cell-long{max-width:260px;font-size:10.5px;color:var(--text2);line-height:1.5}
.kbadge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:rgba(192,132,252,.12);color:#c084fc}
</style>
</head>
<body>
<nav class="nav">
  <a href="index_easy.html" class="nav-brand"><span class="nav-brand-text">⚕️ BERSAHAJA</span></a>
  <div class="nav-links">
    <a href="index_easy.html" class="nav-link">🏠 Home</a>
    <a href="overview.html" class="nav-link">📊 Overview</a>
    <a href="oddp_easy.html" class="nav-link">🧠 ODDP</a>
    <a href="caregiver_easy.html" class="nav-link">🤝 Caregiver</a>
    <a href="kader_easy.html" class="nav-link">🧑‍🤝‍🧑 Kader</a>
    <a href="nakes_easy.html" class="nav-link active">⚕️ Nakes</a>
  </div>
  <div class="nav-right">
    <button onclick="refreshData()" id="refreshBtn" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.25);font-family:inherit">🔄 Refresh</button>
    <button onclick="doLogout()" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;background:rgba(244,63,94,.1);color:#f87171;border:1px solid rgba(244,63,94,.25);font-family:inherit">🚪 Keluar</button>
  </div>
</nav>

<button id="mobileFilterBtn" onclick="toggleMobileSidebar()" style="display:none;position:fixed;top:calc(var(--nav-h,64px)+8px);left:10px;z-index:185;background:rgba(192,132,252,.2);color:#c084fc;border:1px solid rgba(192,132,252,.3);font-family:inherit;font-size:11px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer">☰ Filter</button>

<div class="kpi-strip" id="kpiStrip">
  <div class="kpi-grid" id="kpiGrid">
    <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text3);font-size:12px;padding:16px 0">
      <span style="font-size:18px">⏳</span> <strong style="color:#c084fc;margin:0 4px">Memuat data dari server...</strong>
    </div>
  </div>
</div>

<div class="layout">
<div class="sidebar" id="sidebar">
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbBulan')"><span class="sb-lbl">Bulan</span><span class="sb-chv open" id="chv-sbBulan">▼</span></div>
    <div class="sb-body" id="sbBulan">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('bulan')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('bulan')">✕ Hapus</button></div>
      <div class="tl-list" id="bulanList"></div>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbKab')"><span class="sb-lbl">Kabupaten</span><span class="sb-chv open" id="chv-sbKab">▼</span></div>
    <div class="sb-body" id="sbKab">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('kab')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('kab')">✕ Hapus</button></div>
      <div class="fb-list" id="kabList"></div>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbKec')"><span class="sb-lbl">Kecamatan</span><span class="sb-chv open" id="chv-sbKec">▼</span></div>
    <div class="sb-body" id="sbKec">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('kec')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('kec')">✕ Hapus</button></div>
      <div class="fb-list" id="kecList"></div>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbPK')"><span class="sb-lbl">Asal Puskesmas</span><span class="sb-chv open" id="chv-sbPK">▼</span></div>
    <div class="sb-body" id="sbPK">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('pk')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('pk')">✕ Hapus</button></div>
      <div class="fb-list" id="pkList"></div>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbDesa')"><span class="sb-lbl">Desa</span><span class="sb-chv open" id="chv-sbDesa">▼</span></div>
    <div class="sb-body" id="sbDesa">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('desa')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('desa')">✕ Hapus</button></div>
      <div class="fb-list" id="desaList"></div>
    </div>
  </div>
  <div class="sb-sec">
    <div class="sb-head" onclick="toggleSB('sbNakes')"><span class="sb-lbl">Nama Nakes</span><span class="sb-chv open" id="chv-sbNakes">▼</span></div>
    <div class="sb-body" id="sbNakes">
      <div class="ctrl-row"><button class="ctrl-btn ca" onclick="slAll('nakes')">✓ Semua</button><button class="ctrl-btn cd" onclick="slClear('nakes')">✕ Hapus</button></div>
      <div class="fb-list" id="nakesList"></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="chart-grid">
    <div class="card"><div class="c-ttl">Kunjungan per Kecamatan</div><div class="chart-box"><canvas id="chartKec"></canvas></div></div>
    <div class="card"><div class="c-ttl">Kunjungan per Bulan</div><div class="chart-box"><canvas id="chartBulan"></canvas></div></div>
  </div>
  <div class="chart-grid">
    <div class="card"><div class="c-ttl">Kunjungan per Desa (Top 15)</div><div class="chart-box" style="height:320px"><canvas id="chartDesa"></canvas></div></div>
    <div class="card"><div class="c-ttl">Kunjungan per Asal Puskesmas</div><div class="chart-box" style="height:320px"><canvas id="chartPK"></canvas></div></div>
  </div>
  <div class="card">
    <div class="c-ttl" style="display:flex;align-items:center;gap:8px">📋 Laporan Naratif Kunjungan Nakes <span class="kbadge" id="rowCount"></span></div>
    <div id="narasiSummary" style="margin-top:12px"></div>
    <div id="narasiList" style="margin-top:14px;display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>
</div>

<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3554;color:#dde8f8;font-size:12px;font-weight:600;padding:10px 20px;border-radius:10px;border:1px solid var(--border2);opacity:0;transition:.3s;pointer-events:none;z-index:9999"></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzBjyrkhksYbQhv6RxnzHe_6j4QT_bzmeLdWjvwIL9AJnCITyylm3tlVJr9rJHaHm4i3g/exec';
var TOKEN = localStorage.getItem('bersahaja_token');
if(!TOKEN){ window.location.href='index.html'; }

var RAW=[], CH={};
var SEL={bulan:new Set(),kab:new Set(),kec:new Set(),pk:new Set(),desa:new Set(),nakes:new Set()};
Chart.defaults.color='#3a5575';Chart.defaults.borderColor='#1b2e4a';Chart.defaults.font.family="'Inter',system-ui,sans-serif";Chart.defaults.font.size=10;
function svg(p,c){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var SVG={
  users:svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
  clip:svg('<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>'),
  brain:svg('<path d="M12 5a3 3 0 1 0-5.997.142 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.142 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>'),
  pin:svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
  hosp:svg('<path d="M12 6v4"/><path d="M14 8h-4"/><path d="M4 22V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v18Z"/><path d="M10 22v-3a2 2 0 1 1 4 0v3"/>'),
  steth:svg('<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 12 0V4a2 2 0 0 0-2-2h-1"/><path d="M8 15v1a6 6 0 0 0 12 0v-4"/><circle cx="20" cy="10" r="2"/>')
};
function resizeAll(){Object.values(CH).forEach(c=>{try{c.resize();}catch(e){}});}
var _rt;window.addEventListener('resize',function(){clearTimeout(_rt);_rt=setTimeout(resizeAll,150);});


function normBulan(v){if(v===null||v===undefined||v==='')return '';var s=String(v).trim();var m=s.match(/^(\d{4})-(\d{2})$/);if(m)return m[1]+'-'+m[2];if(/\d{4}-\d{2}-\d{2}/.test(s)){var d=new Date(s);if(!isNaN(d)){var l=new Date(d.getTime()+8*3600*1000);return l.getUTCFullYear()+'-'+String(l.getUTCMonth()+1).padStart(2,'0');}}return s;}
function bulanLabel(k){var kk=normBulan(k);var m=String(kk).match(/^(\d{4})-(\d{2})$/);if(!m)return kk;var A=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return A[parseInt(m[2])]+'-'+m[1].substring(2);}

window.addEventListener('DOMContentLoaded', function(){ fetchData(false); });
function doLogout(){localStorage.clear();window.location.href='index.html';}
function refreshData(){fetchData(true);}
function toggleSB(id){var b=document.getElementById(id);var c=document.getElementById('chv-'+id);var open=b.style.maxHeight!=='0px'&&b.style.display!=='none';if(open){b.style.maxHeight='0px';b.style.display='none';c.classList.remove('open');}else{b.style.display='block';b.style.maxHeight='400px';c.classList.add('open');}}
function toggleMobileSidebar(){document.getElementById('sidebar').classList.toggle('open');}

function fetchData(msg){
  var btn=document.getElementById('refreshBtn');
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  fetch(GAS_URL+'?action=nakes&token='+encodeURIComponent(TOKEN))
  .then(r=>r.json()).then(function(d){
    if(btn){btn.textContent='🔄 Refresh';btn.disabled=false;}
    if(!d.success){ if(d.error&&d.error.indexOf('login')>=0){window.location.href='index.html';return;} showToast('⚠️ '+d.error); return; }
    RAW=(d.rows||[]).map(function(r){return{
      nakes:String(r.nama_nakes||'').trim(), jabatan:String(r.jabatan||'').trim(), jk:String(r.jk||'').trim(), umur:String(r.umur||'').trim(), kontak:String(r.kontak||'').trim(),
      asal_pk:String(r.asal_pk||'').trim(), pk:String(r.asal_pk||'').trim(),
      kab:String(r.kab||'').trim(), kec:String(r.kec||'').trim(), desa:String(r.desa||'').trim(),
      bulan:normBulan(r.bulan), oddp:String(r.nama_oddp||'').trim(),
      tgl:String(r.tgl_kunjungan||'').trim(), kunjungan:String(r.kunjungan||'').trim(),
      observasi:String(r.hasil_observasi||'').trim(), tantangan:String(r.tantangan||'').trim(),
      rtl:String(r.rtl||'').trim(), co:String(r.co||'').trim()
    };}).filter(r=>r.nakes);
    initFilters(); render();
    if(msg!==false)showToast('✅ Data Kader dimuat: '+RAW.length+' baris');
  }).catch(function(e){ if(btn){btn.textContent='🔄 Refresh';btn.disabled=false;} showToast('⚠️ Gagal terhubung: '+e.message); });
}

function uniq(a){return [...new Set(a)].filter(Boolean).sort();}
function initFilters(){
  ['bulan','kab','kec','pk','desa','nakes'].forEach(k=>{ SEL[k]=new Set(uniq(RAW.map(r=>r[k]))); });
  buildAllLists();
}
function buildAllLists(){
  buildBulan(); buildFB('kab','kabList'); buildFB('kec','kecList'); buildFB('pk','pkList'); buildFB('desa','desaList'); buildFB('nakes','nakesList');
}
function buildBulan(){
  var items=uniq(RAW.map(r=>r.bulan));
  document.getElementById('bulanList').innerHTML=items.map(it=>'<button class="fb '+(SEL.bulan.has(it)?'on':'')+'" onclick="toggleF(\'bulan\',\''+it+'\',this)">📅 '+bulanLabel(it)+'</button>').join('');
}
function buildFB(key,elId){
  var items=uniq(RAW.map(r=>r[key]));
  var colors={kab:'#3b82f6',kec:'#10b981',pk:'#f59e0b',desa:'#8b5cf6',nakes:'#c084fc'};
  document.getElementById(elId).innerHTML=items.map(it=>'<button class="fb '+(SEL[key].has(it)?'on':'')+'" onclick="toggleF(\''+key+'\',\''+encodeURIComponent(it)+'\',this,1)"><span class="fb-dot" style="background:'+(colors[key]||'#3b82f6')+'"></span>'+esc(it)+'</button>').join('');
}
function toggleF(key,val,btn,enc){var v=enc?decodeURIComponent(val):val;if(SEL[key].has(v))SEL[key].delete(v);else SEL[key].add(v);btn.classList.toggle('on');render();}
function slAll(key){SEL[key]=new Set(uniq(RAW.map(r=>r[key])));if(key==='bulan')buildBulan();else buildFB(key,key+'List');render();}
function slClear(key){SEL[key]=new Set();if(key==='bulan')buildBulan();else buildFB(key,key+'List');render();}

function getFiltered(){
  function ok(set,v){return v===''||v===null||v===undefined||set.has(v);}
  return RAW.filter(r=>ok(SEL.bulan,r.bulan)&&ok(SEL.kab,r.kab)&&ok(SEL.kec,r.kec)&&ok(SEL.pk,r.pk)&&ok(SEL.desa,r.desa)&&ok(SEL.nakes,r.nakes));
}

function render(){
  var data=getFiltered();
  document.getElementById('kpiGrid').innerHTML=
    kpi(SVG.steth,uc(data,'nakes'),'Total Nakes','#c084fc')+
    kpi(SVG.clip,data.length,'Total Kunjungan','#3b82f6')+
    kpi(SVG.brain,uc(data,'oddp'),'ODDP Terjangkau','#10b981')+
    kpi(SVG.pin,uc(data,'desa'),'Desa Terlayani','#8b5cf6')+
    kpi(SVG.hosp,uc(data,'pk'),'Puskesmas Terlibat','#f43f5e');
  renderCharts(data); renderTable(data);
}
function kpi(ic,v,l,c){return '<div class="kpi-card"><div class="ki">'+ic+'</div><div class="kv" style="color:'+c+'">'+v+'</div><div class="kl">'+l+'</div></div>';}
function uc(data,f){return new Set(data.map(r=>r[f]).filter(Boolean)).size;}

function renderCharts(data){
  var byKec={};data.forEach(r=>{if(r.kec)byKec[r.kec]=(byKec[r.kec]||0)+1;});
  var kk=Object.keys(byKec).sort((a,b)=>byKec[b]-byKec[a]);
  drawBar('chartKec',kk,kk.map(k=>byKec[k]),'#c084fc');
  var byB={};data.forEach(r=>{if(r.bulan)byB[r.bulan]=(byB[r.bulan]||0)+1;});
  var bk=Object.keys(byB).sort();
  drawLine('chartBulan',bk.map(bulanLabel),bk.map(k=>byB[k]),'#f59e0b');
  var byD={};data.forEach(r=>{if(r.desa)byD[r.desa]=(byD[r.desa]||0)+1;});
  var dk=Object.keys(byD).sort((a,b)=>byD[b]-byD[a]).slice(0,15);
  drawBarH('chartDesa',dk,dk.map(k=>byD[k]),'#8b5cf6');
  var byP={};data.forEach(r=>{if(r.pk)byP[r.pk]=(byP[r.pk]||0)+1;});
  var pk=Object.keys(byP).sort((a,b)=>byP[b]-byP[a]).slice(0,15);
  drawBarH('chartPK',pk,pk.map(k=>byP[k]),'#f43f5e');
}
function drawBar(id,l,v,c){if(CH[id])CH[id].destroy();CH[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels:l,datasets:[{data:v,backgroundColor:c+'cc',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},responsive:true,maintainAspectRatio:false,resizeDelay:100}});}
function drawBarH(id,l,v,c){if(CH[id])CH[id].destroy();CH[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels:l,datasets:[{data:v,backgroundColor:c+'cc',borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,resizeDelay:100,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}});}
function drawLine(id,l,v,c){if(CH[id])CH[id].destroy();CH[id]=new Chart(document.getElementById(id),{type:'line',data:{labels:l,datasets:[{data:v,borderColor:c,backgroundColor:c+'22',fill:true,tension:.3,pointRadius:4}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},responsive:true,maintainAspectRatio:false,resizeDelay:100}});}

function renderTable(data){
  document.getElementById('rowCount').textContent=data.length+' kunjungan';
  var sEl=document.getElementById('narasiSummary'), lEl=document.getElementById('narasiList');
  if(!data.length){ sEl.innerHTML=''; lEl.innerHTML='<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">Tidak ada data untuk filter ini.</div>'; return; }

  // Ringkasan
  var nNakes=new Set(data.map(r=>r.nakes).filter(Boolean)).size;
  var nOddp=new Set(data.map(r=>r.oddp).filter(Boolean)).size;
  var nDesa=new Set(data.map(r=>r.desa).filter(Boolean)).size;
  var adaTantangan=data.filter(r=>r.tantangan).length;
  var periode=[...new Set(data.map(r=>r.bulan).filter(Boolean))].sort().map(bulanLabel).join(', ');
  sEl.innerHTML='<div style="background:linear-gradient(135deg,rgba(192,132,252,.08),rgba(139,92,246,.04));border:1px solid rgba(192,132,252,.2);border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.9;color:var(--text2)">'+
    'Selama periode <strong style="color:var(--text)">'+esc(periode||'-')+'</strong>, sebanyak <strong style="color:#c084fc">'+nNakes+' tenaga kesehatan</strong> melakukan <strong style="color:#c084fc">'+data.length+' kunjungan</strong> kepada <strong style="color:#c084fc">'+nOddp+' ODDP</strong> yang tersebar di <strong style="color:#c084fc">'+nDesa+' desa</strong>. '+
    'Dari seluruh kunjungan, <strong style="color:'+(adaTantangan?'#f59e0b':'#34d399')+'">'+adaTantangan+' kunjungan</strong> mencatat adanya tantangan di lapangan yang memerlukan tindak lanjut.'+
    '</div>';

  // Kartu naratif per kunjungan
  lEl.innerHTML=data.map(function(r){
    var blocks='';
    if(r.observasi) blocks+=narBlock('🔍','Hasil Observasi','#3b82f6',r.observasi);
    if(r.tantangan) blocks+=narBlock('⚠️','Tantangan','#f59e0b',r.tantangan);
    if(r.rtl)       blocks+=narBlock('🎯','Rencana Tindak Lanjut','#10b981',r.rtl);
    if(!blocks) blocks='<div style="font-size:11px;color:var(--text3);font-style:italic">Tidak ada catatan observasi/tantangan/RTL.</div>';
    return '<div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface2)">'+
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px">'+
        '<span style="font-weight:700;color:var(--text);font-size:13px">'+esc(r.nakes)+'</span>'+
        (r.jabatan?'<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(192,132,252,.15);color:#c084fc">'+esc(r.jabatan)+'</span>':'')+
        '<span style="font-size:11px;color:var(--text3)">→ mengunjungi</span>'+
        '<span style="font-weight:600;color:var(--text);font-size:12px">'+esc(r.oddp||'-')+'</span>'+
        '<span style="margin-left:auto;font-size:10px;color:var(--text3)">'+esc(r.kec)+(r.desa?' · '+esc(r.desa):'')+' · '+esc(bulanLabel(r.bulan))+(r.tgl?' · '+esc(r.tgl):'')+'</span>'+
      '</div>'+ blocks +
    '</div>';
  }).join('');
}
function narBlock(ic,label,color,text){
  return '<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:'+color+';text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">'+ic+' '+label+'</div>'+
    '<div style="font-size:12px;color:var(--text2);line-height:1.6;padding-left:2px">'+esc(text)+'</div></div>';
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');e.style.opacity='1';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity='0';},3200);}
</script>
</body>
</html>
