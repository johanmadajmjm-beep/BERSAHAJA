<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BERSAHAJA — Overview</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
.ov-wrap{max-width:1320px;margin:0 auto;padding:20px}
.filterbar{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fg select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;font-family:inherit;padding:8px 12px;border-radius:8px;outline:none;min-width:160px}
.fg select:focus{border-color:var(--accent)}
.kpi5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.kc .i{font-size:20px;margin-bottom:8px}
.kc .v{font-size:30px;font-weight:800;line-height:1}
.kc .l{font-size:11px;color:var(--text2);margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.cc h3{font-size:12.5px;font-weight:700;margin-bottom:14px}
.cbox{position:relative;height:220px}
.cbox.tall{height:280px}
@media(max-width:1000px){.kpi5{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav">
  <a href="index_easy.html" class="nav-brand"><span class="nav-brand-text">📊 BERSAHAJA</span></a>
  <div class="nav-links">
    <a href="index_easy.html" class="nav-link">🏠 Home</a>
    <a href="overview.html" class="nav-link active">📊 Overview</a>
    <a href="oddp_easy.html" class="nav-link">🧠 ODDP</a>
    <a href="caregiver_easy.html" class="nav-link">🤝 Caregiver</a>
    <a href="kader_easy.html" class="nav-link">🧑‍🤝‍🧑 Kader</a>
    <a href="nakes_easy.html" class="nav-link">⚕️ Nakes</a>
  </div>
  <div class="nav-right">
    <button onclick="refreshData()" id="refreshBtn" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);font-family:inherit">🔄 Refresh</button>
    <button onclick="doLogout()" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;background:rgba(244,63,94,.1);color:#f87171;border:1px solid rgba(244,63,94,.25);font-family:inherit">🚪 Keluar</button>
  </div>
</nav>

<div class="ov-wrap">
  <div class="filterbar" id="filterbar" style="display:none">
    <div class="fg"><label>Bulan</label><select id="fBulan" onchange="render()"><option value="">Semua Periode</option></select></div>
    <div class="fg"><label>Kabupaten</label><select id="fKab" onchange="render()"><option value="">Semua</option></select></div>
    <div class="fg"><label>Kecamatan</label><select id="fKec" onchange="render()"><option value="">Semua</option></select></div>
    <div style="margin-left:auto;font-size:10px;color:var(--text3);align-self:center" id="statusLine"></div>
  </div>

  <div class="kpi5" id="kpi5">
    <div class="kc"><div class="i">⏳</div><div class="v">–</div><div class="l">Memuat data dari server...</div></div>
  </div>

  <div id="charts" style="display:none">
    <div class="grid3">
      <div class="cc"><h3>🏥 Cakupan BPJS (ODDP)</h3><div class="cbox"><canvas id="cBpjs"></canvas></div></div>
      <div class="cc"><h3>🧭 Status Klinis ODDP</h3><div class="cbox"><canvas id="cStatus"></canvas></div></div>
      <div class="cc"><h3>🚪 Akses ke Faskes</h3><div class="cbox"><canvas id="cFaskes"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="cc"><h3>🩺 Distribusi Diagnosa</h3><div class="cbox tall"><canvas id="cDiag"></canvas></div></div>
      <div class="cc"><h3>⚠️ Tingkat Keparahan</h3><div class="cbox tall"><canvas id="cKeparahan"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="cc"><h3>👥 Distribusi Umur ODDP</h3><div class="cbox"><canvas id="cUmur"></canvas></div></div>
      <div class="cc"><h3>⚧ Jenis Kelamin per Program</h3><div class="cbox"><canvas id="cJK"></canvas></div></div>
    </div>
    <div class="cc" style="margin-bottom:14px"><h3>📍 Sebaran ODDP per Kecamatan</h3><div class="cbox tall"><canvas id="cKec"></canvas></div></div>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e3554;color:#dde8f8;font-size:12px;font-weight:600;padding:10px 20px;border-radius:10px;border:1px solid var(--border2);opacity:0;transition:.3s;pointer-events:none;z-index:9999"></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzBjyrkhksYbQhv6RxnzHe_6j4QT_bzmeLdWjvwIL9AJnCITyylm3tlVJr9rJHaHm4i3g/exec';
var TOKEN = localStorage.getItem('bersahaja_token');
if(!TOKEN){ window.location.href='index.html'; }

var DATA={oddp:[],cg:[],kader:[],nakes:[]}, CH={};
Chart.defaults.color='#3a5575';Chart.defaults.borderColor='#1b2e4a';Chart.defaults.font.family="'Inter',system-ui,sans-serif";Chart.defaults.font.size=10;

function normBulan(v){if(v===null||v===undefined||v==='')return '';var s=String(v).trim();var m=s.match(/^(\d{4})-(\d{2})$/);if(m)return m[1]+'-'+m[2];if(/\d{4}-\d{2}-\d{2}/.test(s)){var d=new Date(s);if(!isNaN(d)){var l=new Date(d.getTime()+8*3600*1000);return l.getUTCFullYear()+'-'+String(l.getUTCMonth()+1).padStart(2,'0');}}return s;}
function bulanLabel(k){var kk=normBulan(k);var m=String(kk).match(/^(\d{4})-(\d{2})$/);if(!m)return kk;var A=['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];return A[parseInt(m[2])]+'-'+m[1].substring(2);}
function normJK(v){var s=String(v||'').trim().toUpperCase();if(s.charAt(0)==='L')return'L';if(s.charAt(0)==='P')return'P';return '';}
function yn(v){var s=String(v||'').trim().toLowerCase();if(s==='ya'||s==='y')return'Ya';if(s==='tidak'||s==='t')return'Tidak';return '';}
function normDiag(d){var s=String(d||'').trim().toLowerCase();if(!s)return '';if(s.indexOf('skiz')>=0)return'Skizofrenia';if(s.indexOf('bipolar')>=0)return'Bipolar';if(s.indexOf('depres')>=0)return'Depresi';if(s.indexOf('cemas')>=0||s.indexOf('anxiet')>=0)return'Gangguan Cemas';if(s.indexOf('perkembang')>=0)return'Gangguan Perkembangan';if(s.indexOf('psikotik')>=0)return'Psikotik Lain';return'Lainnya';}
function normKeparahan(v){var s=String(v||'').trim().toLowerCase();if(s.indexOf('ringan')>=0)return'Ringan';if(s.indexOf('sedang')>=0)return'Sedang';if(s.indexOf('berat')>=0)return'Berat';return '';}

window.addEventListener('DOMContentLoaded', function(){ fetchAll(false); });
function doLogout(){localStorage.clear();window.location.href='index.html';}
function refreshData(){fetchAll(true);}

function fetchOne(action){
  return fetch(GAS_URL+'?action='+action+'&token='+encodeURIComponent(TOKEN)).then(r=>r.json());
}
function fetchAll(msg){
  var btn=document.getElementById('refreshBtn');
  if(btn){btn.textContent='⏳';btn.disabled=true;}
  Promise.all([fetchOne('oddp'),fetchOne('cg'),fetchOne('kader'),fetchOne('nakes')])
  .then(function(res){
    if(btn){btn.textContent='🔄 Refresh';btn.disabled=false;}
    var bad=res.find(d=>!d.success);
    if(bad){ if(bad.error&&bad.error.indexOf('login')>=0){window.location.href='index.html';return;} showToast('⚠️ '+bad.error); return; }
    DATA.oddp =(res[0].rows||[]).map(mapODDP);
    DATA.cg   =(res[1].rows||[]).map(mapCG);
    DATA.kader=(res[2].rows||[]).map(mapKN);
    DATA.nakes=(res[3].rows||[]).map(mapKN);
    initFilters(); render();
    document.getElementById('filterbar').style.display='flex';
    document.getElementById('charts').style.display='block';
    if(msg!==false)showToast('✅ Data dimuat: ODDP '+DATA.oddp.length+' · CG '+DATA.cg.length+' · Kader '+DATA.kader.length+' · Nakes '+DATA.nakes.length);
  }).catch(function(e){ if(btn){btn.textContent='🔄 Refresh';btn.disabled=false;} showToast('⚠️ Gagal terhubung: '+e.message); });
}

function mapODDP(r){return{nama:String(r.nama||'').trim(),jk:normJK(r.jk),umur:parseInt(r.umur)||null,kab:String(r.kab||'').trim(),kec:String(r.kec||'').trim(),bulan:normBulan(r.bulan),bpjs:yn(r.bpjs),status:String(r.status||'').trim(),diag:normDiag(r.diagnosa),keparahan:normKeparahan(r.keparahan),faskes:yn(r.kunjungan_faskes)};}
function mapCG(r){return{nama:String(r.nama||'').trim(),jk:normJK(r.jk),kab:String(r.kab||'').trim(),kec:String(r.kec||'').trim(),bulan:normBulan(r.bulan)};}
function mapKN(r){return{jk:normJK(r.jk),kab:String(r.kab||'').trim(),kec:String(r.kec||'').trim(),bulan:normBulan(r.bulan)};}

function uniq(a){return [...new Set(a)].filter(Boolean).sort();}
function initFilters(){
  var allB=uniq([].concat(DATA.oddp,DATA.cg,DATA.kader,DATA.nakes).map(r=>r.bulan));
  var fb=document.getElementById('fBulan');
  fb.innerHTML='<option value="">Semua Periode</option>'+allB.map(b=>'<option value="'+b+'">'+bulanLabel(b)+'</option>').join('');
  var allK=uniq([].concat(DATA.oddp,DATA.cg,DATA.kader,DATA.nakes).map(r=>r.kab));
  document.getElementById('fKab').innerHTML='<option value="">Semua</option>'+allK.map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>');
  var allC=uniq([].concat(DATA.oddp,DATA.cg,DATA.kader,DATA.nakes).map(r=>r.kec));
  document.getElementById('fKec').innerHTML='<option value="">Semua</option>'+allC.map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>');
}
function flt(arr){
  var b=document.getElementById('fBulan').value,k=document.getElementById('fKab').value,c=document.getElementById('fKec').value;
  return arr.filter(r=>(!b||r.bulan===b)&&(!k||r.kab===k)&&(!c||r.kec===c));
}
// Dedupe ODDP by nama (ambil baris terakhir/terbaru) untuk hitung per-orang
function dedupeODDP(arr){var m={};arr.slice().sort((a,b)=>String(a.bulan)<String(b.bulan)?-1:1).forEach(r=>{if(r.nama)m[r.nama]=r;});return Object.values(m);}

function render(){
  var o=flt(DATA.oddp), cg=flt(DATA.cg), kd=flt(DATA.kader), nk=flt(DATA.nakes);
  var oU=dedupeODDP(o);
  var cgU=[...new Set(cg.map(r=>r.nama))].filter(Boolean).length;

  document.getElementById('kpi5').innerHTML=
    kc('🧠',oU.length,'ODDP Terpantau','#3b82f6')+
    kc('🤝',cgU,'Caregiver','#10b981')+
    kc('🧑‍🤝‍🧑',kd.length,'Kunjungan Kader','#fbbf24')+
    kc('⚕️',nk.length,'Kunjungan Nakes','#c084fc')+
    kc('📋',kd.length+nk.length,'Total Kunjungan','#f43f5e');

  document.getElementById('statusLine').textContent='Basis: '+oU.length+' ODDP unik';

  donut('cBpjs', countBy(oU,'bpjs',['Ya','Tidak']), ['#10b981','#f43f5e']);
  donut('cStatus', countBy(oU,'status',['Stabil','Belum Stabil','Amuk']), ['#10b981','#f59e0b','#f43f5e']);
  donut('cFaskes', countBy(oU,'faskes',['Ya','Tidak']), ['#3b82f6','#64748b']);

  var diagC=countByAuto(oU,'diag'); barH('cDiag',diagC.labels,diagC.vals,'#8b5cf6');
  barH('cKeparahan', ['Ringan','Sedang','Berat'].map(k=>k), ['Ringan','Sedang','Berat'].map(k=>oU.filter(r=>r.keparahan===k).length), '#f59e0b');

  // Umur groups
  var groups=['<18','18-30','31-45','46-60','>60'];
  var gc=groups.map(g=>0);
  oU.forEach(r=>{var u=r.umur;if(u==null)return;if(u<18)gc[0]++;else if(u<=30)gc[1]++;else if(u<=45)gc[2]++;else if(u<=60)gc[3]++;else gc[4]++;});
  barV('cUmur',groups,gc,'#3b82f6');

  // JK per program
  jkChart(o,cg,kd,nk);

  // ODDP per kecamatan
  var byKec={};oU.forEach(r=>{if(r.kec)byKec[r.kec]=(byKec[r.kec]||0)+1;});
  var kk=Object.keys(byKec).sort((a,b)=>byKec[b]-byKec[a]);
  barH('cKec',kk,kk.map(k=>byKec[k]),'#10b981');
}

function kc(i,v,l,c){return '<div class="kc"><div class="i">'+i+'</div><div class="v" style="color:'+c+'">'+v+'</div><div class="l">'+l+'</div></div>';}
function countBy(arr,f,keys){return {labels:keys,vals:keys.map(k=>arr.filter(r=>r[f]===k).length)};}
function countByAuto(arr,f){var m={};arr.forEach(r=>{if(r[f])m[r[f]]=(m[r[f]]||0)+1;});var keys=Object.keys(m).sort((a,b)=>m[b]-m[a]);return{labels:keys,vals:keys.map(k=>m[k])};}

function donut(id,c,colors){if(CH[id])CH[id].destroy();var total=c.vals.reduce((a,b)=>a+b,0);CH[id]=new Chart(document.getElementById(id),{type:'doughnut',data:{labels:c.labels,datasets:[{data:c.vals,backgroundColor:colors,borderColor:'#0c1625',borderWidth:2}]},options:{cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10,font:{size:10}}},tooltip:{callbacks:{label:x=>' '+x.label+': '+x.raw+(total?' ('+(x.raw/total*100).toFixed(0)+'%)':'')}}},maintainAspectRatio:false}});}
function barH(id,labels,vals,c){if(CH[id])CH[id].destroy();CH[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:c+'cc',borderRadius:5}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});}
function barV(id,labels,vals,c){if(CH[id])CH[id].destroy();CH[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:c+'cc',borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});}
function jkChart(o,cg,kd,nk){
  if(CH.cJK)CH.cJK.destroy();
  function cnt(arr,jk){return arr.filter(r=>r.jk===jk).length;}
  var progs=['ODDP','Caregiver','Kader','Nakes'];var sets=[o,cg,kd,nk];
  CH.cJK=new Chart(document.getElementById('cJK'),{type:'bar',data:{labels:progs,datasets:[
    {label:'Laki-laki',data:sets.map(s=>cnt(s,'L')),backgroundColor:'#3b82f6cc',borderRadius:4},
    {label:'Perempuan',data:sets.map(s=>cnt(s,'P')),backgroundColor:'#f43f5ecc',borderRadius:4}
  ]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m){var e=document.getElementById('toast');e.textContent=m;e.style.opacity='1';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.opacity='0';},3400);}
</script>
</body>
</html>
